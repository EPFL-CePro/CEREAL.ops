- include_tasks:
    file: setup.yml
    apply:
      tags:
        - cereal.setup
  tags: always

- include_tasks:
    file: repository.yml
    apply:
      tags:
        - cereal.repository
  tags: always

- include_tasks:
    file: run.yml
    apply:
      tags:
        - cereal.run
  tags: always

- include_tasks:
    file: backup.yml
    apply:
      tags:
        - cereal.backup
  tags: always

- include_tasks:
    file: apache.yml
    apply:
      tags:
        - cereal.apache
  tags: always

# After run.yml and apache.yml, which prepare what the containers mount
- include_tasks:
    file: compose.yml
    apply:
      tags:
        - cereal.run
        - cereal.apache
  tags: always
