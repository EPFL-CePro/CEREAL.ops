- name: Ensure /etc/samba directory exists
  file: 
    path: "/etc/samba/"
    state: directory

- name: "Copy cifs credentials from keybase ({{ inventory_mode }})"
  copy:
    src: "/keybase/team/cepro_cereal/cifs_creds"
    dest: /etc/samba/creds_cereal_printing

- name: "Ensure CREP_PRINTING mounting directory exists"
  file: 
    path: "/mnt/CREP_PRINTING"
    state: directory

- name: "Ensure SCAN_EXAMS mounting directory exists"
  file: 
    path: "/mnt/SCAN_EXAMS"
    state: directory

- name: "Ensure EXAM-DIFF mounting directory exists"
  file: 
    path: "/mnt/EXAM-DIFF"
    state: directory

- name: "Ensure NAS-EXAMS-ARCHIVES mounting directory exists"
  file: 
    path: "/mnt/NAS-EXAMS-ARCHIVES"
    state: directory

# Mounting SMB to /mnt/CREP_PRINTING, also putting this configuration into /etc/fstab so that it automatically mounts on restart.
- name: "Mount CREP_PRINTING SMB share"
  ansible.posix.mount:
    path: /mnt/CREP_PRINTING
    src: "{{ '//vpsi1files.epfl.ch/CAPE/TEST_CREP_EXAM' if inventory_environment == 'test' else '//vpsi1files.epfl.ch/repro_exam_printing' }}"
    fstype: cifs
    opts: credentials=/etc/samba/creds_cereal_printing,iocharset=utf8,vers=3.0,_netdev
    state: mounted

# Mounting SMB to /mnt/EXAM-DIFF, also putting this configuration into /etc/fstab so that it automatically mounts on restart.
- name: "Mount EXAM-DIFF SMB share"
  ansible.posix.mount:
    path: /mnt/EXAM-DIFF
    src: "{{ '//vpsi1files.epfl.ch/cepro_exdiff_dev' if inventory_environment == 'test' else '//vpsi1files.epfl.ch/cepro_exdiff' }}"
    fstype: cifs
    opts: credentials=/etc/samba/creds_cereal_printing,iocharset=utf8,vers=3.0,_netdev
    state: mounted

# Mounting SMB to /mnt/SCAN_EXAMS, also putting this configuration into /etc/fstab so that it automatically mounts on restart.
- name: "Mount SCAN_EXAMS SMB share"
  ansible.posix.mount:
    path: /mnt/SCAN_EXAMS
    src: "//vpsi1files.epfl.ch/CAPE/SCAN_EXAMS"
    fstype: cifs
    opts: credentials=/etc/samba/creds_cereal_printing,iocharset=utf8,vers=3.0,_netdev
    state: mounted

# Mounting SMB to /mnt/NAS-EXAMS-ARCHIVES, also putting this configuration into /etc/fstab so that it automatically mounts on restart.
- name: "Mount NAS-EXAMS-ARCHIVES SMB share"
  ansible.posix.mount:
    path: /mnt/NAS-EXAMS-ARCHIVES
    src: "//ent1arch.epfl.ch/avp-e-cepro-003/"
    fstype: cifs
    opts: credentials=/etc/samba/creds_cereal_printing,iocharset=utf8,vers=3.0,_netdev
    state: mounted
