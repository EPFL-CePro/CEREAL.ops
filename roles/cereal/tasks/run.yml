- name: Ensure /etc/samba directory exists
  file: 
    path: "/etc/samba/"
    state: directory

- name: "Copy cifs credentials from keybase ({{ inventory_mode }})"
  copy:
    src: "/keybase/team/cepro_cereal/cifs_creds"
    dest: /etc/samba/creds_cereal_printing

- name: "Ensure CREP_PRINTING mounting directory exists"
  file: 
    path: "/mnt/CREP_PRINTING"
    state: directory

- name: "Ensure SCAN_EXAMS mounting directory exists"
  file: 
    path: "/mnt/SCAN_EXAMS"
    state: directory

- name: "Ensure EXAM-DIFF mounting directory exists"
  file: 
    path: "/mnt/EXAM-DIFF"
    state: directory

- name: "Ensure NAS-EXAMS-ARCHIVES mounting directory exists"
  file: 
    path: "/mnt/NAS-EXAMS-ARCHIVES"
    state: directory

# Mounting SMB to /mnt/CREP_PRINTING, also putting this configuration into /etc/fstab so that it automatically mounts on restart.
- name: "Mount CREP_PRINTING SMB share"
  ansible.posix.mount:
    path: /mnt/CREP_PRINTING
    src: "{{ '//vpsi1files.epfl.ch/CAPE/TEST_CREP_EXAM' if inventory_environment == 'test' else '//vpsi1files.epfl.ch/repro_exam_printing' }}"
    fstype: cifs
    opts: credentials=/etc/samba/creds_cereal_printing,iocharset=utf8,vers=3.0,_netdev
    state: mounted

# Mounting SMB to /mnt/EXAM-DIFF, also putting this configuration into /etc/fstab so that it automatically mounts on restart.
- name: "Mount EXAM-DIFF SMB share"
  ansible.posix.mount:
    path: /mnt/EXAM-DIFF
    src: "{{ '//vpsi1files.epfl.ch/cepro_exdiff_dev' if inventory_environment == 'test' else '//vpsi1files.epfl.ch/cepro_exdiff' }}"
    fstype: cifs
    opts: credentials=/etc/samba/creds_cereal_printing,iocharset=utf8,vers=3.0,_netdev
    state: mounted

# Mounting SMB to /mnt/SCAN_EXAMS, also putting this configuration into /etc/fstab so that it automatically mounts on restart.
- name: "Mount SCAN_EXAMS SMB share"
  ansible.posix.mount:
    path: /mnt/SCAN_EXAMS
    src: "//vpsi1files.epfl.ch/CAPE/SCAN_EXAMS"
    fstype: cifs
    opts: credentials=/etc/samba/creds_cereal_printing,iocharset=utf8,vers=3.0,_netdev
    state: mounted

# Mounting SMB to /mnt/NAS-EXAMS-ARCHIVES, also putting this configuration into /etc/fstab so that it automatically mounts on restart.
- name: "Mount NAS-EXAMS-ARCHIVES SMB share"
  ansible.posix.mount:
    path: /mnt/NAS-EXAMS-ARCHIVES
    src: "//ent1arch.epfl.ch/avp-e-cepro-003/"
    fstype: cifs
    opts: credentials=/etc/samba/creds_cereal_printing,iocharset=utf8,vers=3.0,_netdev
    state: mounted

# scans_monitor.js runs on the host, so its dependencies must be installed there.
# A node_modules without pnpm's `.modules.yaml` was installed by npm and must be removed first, pnpm cannot purge it without a TTY.
- name: Check whether node_modules was installed by pnpm
  stat:
    path: /data/cereal/node_modules/.modules.yaml
  register: _pnpm_modules_marker

- name: Remove node_modules installed by npm
  file:
    path: /data/cereal/node_modules
    state: absent
  when: not _pnpm_modules_marker.stat.exists

- name: Install scans monitor dependencies with pnpm
  ansible.builtin.command:
    cmd: pnpm install --prod --frozen-lockfile
    chdir: /data/cereal
  register: _pnpm_install
  changed_when: _pnpm_install.stdout is search('^[+-] ', multiline=True)

- name: "Launch scans monitor crontab script"
  ansible.builtin.cron:
    name: "configurate scans folder monitor crontab"
    minute: "*/5"
    job: "node /data/cereal/scans_monitor.js"
  when: inventory_environment == 'prod'

- name: Create Docker network
  ansible.builtin.docker_network:
    name: cereal-network

- name: Create MySQL Docker container
  ansible.builtin.docker_container:
    name: cereal-app-db
    image: mysql
    state: started
    restart_policy: unless-stopped
    env_file: /data/cereal/.env
    published_ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - "./db:/docker-entrypoint-initdb.d"
    networks:
      - name: cereal-network
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
      timeout: 5s
      retries: 10

# A new MySQL container takes a few seconds to initialize, the migrations below need it to be ready
- name: Wait for MySQL to be healthy
  community.docker.docker_container_info:
    name: cereal-app-db
  register: _mysql_container
  until: _mysql_container.container.State.Health.Status == 'healthy'
  retries: 30
  delay: 2

# The CEREAL image is built and published to GHCR by the CI of CEREAL, tagged with the version of `package.json`.
- name: Read the CEREAL version
  ansible.builtin.slurp:
    src: /data/cereal/package.json
  register: _cereal_package_json

- name: Set the CEREAL image name
  ansible.builtin.set_fact:
    _cereal_image: "ghcr.io/epfl-cepro/cereal:{{ (_cereal_package_json.content | b64decode | from_json).version }}"

- name: Pull CEREAL image from GHCR
  community.docker.docker_image:
    name: "{{ _cereal_image }}"
    source: pull

- name: Check whether the database predates Prisma
  community.mysql.mysql_query:
    login_db: "{{ keybase_secrets.mysql.database }}"
    login_user: "{{ keybase_secrets.mysql.user }}"
    login_password: "{{ keybase_secrets.mysql.password }}"
    query: SELECT COUNT(CASE WHEN TABLE_NAME = '_prisma_migrations' THEN 1 END) AS prisma, COUNT(CASE WHEN TABLE_NAME = 'crep' THEN 1 END) AS existing FROM information_schema.TABLES WHERE TABLE_SCHEMA = '{{ keybase_secrets.mysql.database }}';
  register: prisma_baseline

# A database created before Prisma already has the tables of the `0_init` baseline migration: it must be marked as applied, never run.
# An empty database (new server) is not baselined: `migrate deploy` runs `0_init` like any other migration.
- name: Mark the Prisma baseline migration `0_init` as applied
  ansible.builtin.docker_container:
    name: cereal-migrate
    image: "{{ _cereal_image }}"
    command: node_modules/.bin/prisma migrate resolve --applied 0_init
    detach: false
    cleanup: true
    networks:
      - name: cereal-network
    env_file: /data/cereal/.env
  when: >-
    prisma_baseline.query_result[0][0].prisma | int == 0
    and prisma_baseline.query_result[0][0].existing | int == 1

# The migrations run from the app image, which contains the Prisma CLI and the migrations.
# Fails the deployment before the app is restarted if a migration fails
- name: Apply Prisma migrations
  ansible.builtin.docker_container:
    name: cereal-migrate
    image: "{{ _cereal_image }}"
    command: node_modules/.bin/prisma migrate deploy
    detach: false
    cleanup: true
    networks:
      - name: cereal-network
    env_file: /data/cereal/.env

- name: Create Docker CEREAL
  ansible.builtin.docker_container:
    name: cereal-app
    image: "{{ _cereal_image }}"
    state: started
    ports:
      - "3000:3000"
    networks:
      - name: cereal-network
        aliases:
          - nextjs
    env:
      NODE_ENV: production
      CEREAL_ENV: "{{ inventory_environment }}"
    env_file: /data/cereal/.env
    volumes:
      - /mnt/CREP_PRINTING:/mnt/CREP_PRINTING:rw
      - /mnt/EXAM-DIFF/:/mnt/EXAM-DIFF:rw
      - /mnt/NAS-EXAMS-ARCHIVES/:/mnt/NAS-EXAMS-ARCHIVES:rw
