- name: Ensure Apache configuration directory exists
  file:
    path: /data/apache/conf
    state: directory
    mode: '0755'

- name: Ensure Apache certs directory exists
  file:
    path: /data/apache/certs
    state: directory
    mode: '0700'

# cereal_epfl_ch-crt.pem already contains the certificate followed by the DigiCert intermediate
- name: Copy certs from Keybase
  copy:
    src: "{{ item }}"
    dest: /data/apache/certs/
    owner: root
    mode: '0600'
  with_fileglob:
    - "/keybase/team/cepro_cereal/cereal-serveur.key"
    - "/keybase/team/cepro_cereal/cereal_epfl_ch-crt.pem"
  register: _apache_certs

- name: Create Apache configuration
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/data/apache/conf/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - httpd.conf
    - cereal.conf
  register: _apache_conf

- name: Pull Apache image
  community.docker.docker_image:
    name: "{{ cereal_apache_image }}"
    source: pull

# Also created in run.yml, repeated here so that `-t cereal.apache` works on its own
- name: Create Docker network
  community.docker.docker_network:
    name: cereal-network

# Fails the deployment before the running Apache is restarted if the configuration is invalid
- name: Validate Apache configuration
  community.docker.docker_container:
    name: cereal-apache-configtest
    image: "{{ cereal_apache_image }}"
    command: httpd -t -f /usr/local/apache2/conf/cereal/httpd.conf
    detach: false
    cleanup: true
    volumes: "{{ cereal_apache_volumes }}"
  changed_when: false

- name: Create Docker Apache
  community.docker.docker_container:
    name: cereal-apache
    image: "{{ cereal_apache_image }}"
    command: httpd-foreground -f /usr/local/apache2/conf/cereal/httpd.conf
    state: started
    restart_policy: unless-stopped
    restart: "{{ _apache_conf.changed or _apache_certs.changed }}"
    published_ports:
      - "80:80"
      - "443:443"
    networks:
      - name: cereal-network
    volumes: "{{ cereal_apache_volumes }}"
    log_driver: json-file
    log_options:
      max-size: 10m
      max-file: "5"
