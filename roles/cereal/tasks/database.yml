- name: Create trigger `crep_after_update` AFTER UPDATE ON `crep`
  community.mysql.mysql_query:
    login_db: "{{ keybase_secrets.mysql.database }}"
    login_user: "{{ keybase_secrets.mysql.user }}"
    login_password: "{{ keybase_secrets.mysql.password }}"
    query: CREATE TRIGGER `crep_after_update` AFTER UPDATE ON `crep` FOR EACH ROW INSERT INTO crep_log (action, date_time, crep_id, exam_name, delivery_date, exam_date, contact, exam_code) VALUES ('update', NOW(), NEW.id, NEW.exam_name, NEW.print_date, NEW.exam_date, NEW.contact, NEW.exam_code);
  when: crep_after_update.query_result[0][0].cnt | int == 0
  
- name: Check trigger `crep_after_delete`
  community.mysql.mysql_query:
    login_db: "{{ keybase_secrets.mysql.database }}"
    login_user: "{{ keybase_secrets.mysql.user }}"
    login_password: "{{ keybase_secrets.mysql.password }}"
    query: SELECT COUNT(*) AS cnt FROM information_schema.TRIGGERS WHERE TRIGGER_SCHEMA = '{{ keybase_secrets.mysql.database }}' AND TRIGGER_NAME = 'crep_after_delete';
  register: crep_after_delete

- name: Create trigger `crep_after_delete` AFTER DELETE ON `crep`
  community.mysql.mysql_query:
    login_db: "{{ keybase_secrets.mysql.database }}"
    login_user: "{{ keybase_secrets.mysql.user }}"
    login_password: "{{ keybase_secrets.mysql.password }}"
    query: CREATE TRIGGER `crep_after_delete` AFTER DELETE ON `crep` FOR EACH ROW INSERT INTO crep_log (action, date_time, crep_id, exam_name, delivery_date, exam_date, contact, exam_code) VALUES ('delete', NOW(), OLD.id, OLD.exam_name, OLD.print_date, OLD.exam_date, OLD.contact, OLD.exam_code);
  when: crep_after_delete.query_result[0][0].cnt | int == 0

- name: Ensure /data/cereal-backups directory exists
  file: 
    path: /data/cereal-backups
    state: directory

- name: Ensure /etc/samba directory exists
  file: 
    path: "/etc/samba/"
    state: directory

- name: "Copy cifs credentials from keybase ({{ inventory_mode }})"
  copy:
    src: "/keybase/team/cepro_cereal/cifs_creds"
    dest: /etc/samba/creds_cereal_printing

- name: Mount NAS-backup SMB share
  ansible.posix.mount:
    path: /data/cereal-backups
    src: "{{ '//vpsi1files.epfl.ch/CEPRO/BACKUP/CEREAL_TEST' if inventory_environment == 'test' else '//vpsi1files.epfl.ch/CEPRO/BACKUP/CEREAL' }}"
    fstype: cifs
    opts: credentials=/etc/samba/creds_cereal_printing,iocharset=utf8,vers=3.0,_netdev
    state: mounted

- name: "Launch backup crontab script"
  ansible.builtin.cron:
    name: "configurate mysql backup crontab"
    minute: "0"
    hour: "0"
    job: "/data/cereal/database_backup.sh >> /var/log/mysql_backup.log 2>&1"
