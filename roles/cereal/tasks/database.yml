---
- name: Create Docker network
  ansible.builtin.docker_network:
    name: cereal-network

- name: Create MySQL Docker container
  ansible.builtin.docker_container:
    name: cereal-app-db
    image: mysql
    state: started
    restart_policy: unless-stopped
    env_file: /data/cereal/.env
    published_ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - "./db:/docker-entrypoint-initdb.d"
    networks:
      - name: cereal-network
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
      timeout: 5s
      retries: 10

- name: Create `crep` table if not exists
  community.mysql.mysql_query:
    login_db: "{{ keybase_secrets.mysql.database }}"
    login_user: "{{ keybase_secrets.mysql.user }}"
    login_password: "{{ keybase_secrets.mysql.password }}"
    query: CREATE TABLE IF NOT EXISTS `crep` (
        `id` int NOT NULL,
        `exam_name` varchar(256) NOT NULL,
        `exam_code` varchar(24) NOT NULL,
        `status` varchar(32) NOT NULL DEFAULT 'registered',
        `print_date` datetime NOT NULL,
        `print_duration` int NOT NULL DEFAULT 0,
        `remark` mediumtext,
        `repro_remark` mediumtext,
        `exam_date` date NOT NULL,
        `contact` MEDIUMTEXT NOT NULL,
        `authorized_persons` MEDIUMTEXT NOT NULL,
        `registered_by` varchar(256) NOT NULL,
        `financial_center` varchar(10) NOT NULL,
        `desired_date` date NOT NULL,
        `boxes` int NOT NULL DEFAULT 0,
        `price_unit` float NOT NULL DEFAULT 0,
        `price_total` float NOT NULL DEFAULT 0,
        `created_on` date NOT NULL DEFAULT (CURRENT_DATE),
        `order_number` varchar(30)
      ) ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_0900_ai_ci;

