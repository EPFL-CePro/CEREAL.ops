- name: Ensure that CREP repository is present and up to date
  git:
    repo: 'https://github.com/epfl-cepro/crep'
    dest: /var/www/html/crep
    version: "main"
    force: yes

- name: "Copy env secrets from keybase ({{ inventory_mode }})"
  copy:
    src: "/keybase/team/cepro_crep/secrets-{{ inventory_mode }}.env"
    dest: /var/www/html/crep/.env

- name: Ensure /etc/samba directory exists
  file: 
    path: "/etc/samba/"
    state: directory

- name: "Copy cifs credentials from keybase ({{ inventory_mode }})"
  copy:
    src: "/keybase/team/cepro_crep/cifs_creds"
    dest: /etc/samba/creds_crep_printing

- name: "Ensure repro_exam_printing mounting directory exists"
  file: 
    path: "/mnt/repro_exam_printing"
    state: directory

# Mounting SMB to /mnt/repro_exam_printing, also putting this configuration into /etc/fstab so that it automatically mounts on restart.
- name: "Mount repro_exam_printing SMB share"
  ansible.posix.mount:
    path: /mnt/repro_exam_printing
    src: //vpsi1files.epfl.ch/repro_exam_printing
    fstype: cifs
    opts: credentials=/etc/samba/creds_crep_printing,iocharset=utf8,vers=3.0,_netdev
    state: mounted

- name: Create Docker network
  ansible.builtin.docker_network:
    name: crep-network

- name: Build CREP image
  community.docker.docker_image:
    name: crep
    source: build
    force_source: yes
    build:
      path: /var/www/html/crep

- name: Create Docker CREP
  ansible.builtin.docker_container:
    name: crep-app
    image: crep
    state: started
    ports:
      - "3000:3000"
    networks:
      - name: crep-network
        aliases:
          - nextjs
    env:
      NODE_ENV: production
    env_file: /var/www/html/crep/.env
    # /mnt/repro_exam_printing is mounted inside the container, also with the path /mnt/repro_exam_printing
    volumes:
      - /mnt/repro_exam_printing:/mnt/repro_exam_printing:rw