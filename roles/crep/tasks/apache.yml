- name: Enable required Apache modules
  ansible.builtin.command: "a2enmod {{ item }}"
  loop:
    - proxy
    - proxy_http
    - headers
    - rewrite
    - ssl
  changed_when: false

- name: Ensure Apache certs repository exists
  file:
    state: directory
    path: "{{ item }}"
    mode: '0755'
  with_items:
   - /etc/ssl/
   - /etc/ssl/certs/
   - /etc/ssl/certs/crep/

- name: Copy certs to /etc/ssl/certs/crep from Keybase
  copy:
    src: "{{ item }}"
    dest: /etc/ssl/certs/crep/
    owner: root
    mode: 600
  with_fileglob:
    - "/keybase/team/cepro_crep/crep-serveur.key"
    - "/keybase/team/cepro_crep/DigiCertCA.crt"
    - "/keybase/team/cepro_crep/crep_epfl_ch-crt.pem"

- name: Create Apache virtual host configuration
  ansible.builtin.template:
    src: crep.conf.j2
    dest: /etc/apache2/sites-available/crep.conf
    owner: root
    group: root
    mode: '0644'

- name: Disable default Apache sites
  ansible.builtin.command: "a2dissite {{ item }}"
  loop:
    - 000-default.conf
    - default-ssl.conf
  failed_when: false
  changed_when: false

- name: Enable CREP site
  ansible.builtin.command: a2ensite crep.conf
  changed_when: false

- name: Validate Apache configuration
  ansible.builtin.command: apache2ctl configtest

- name: Ensure Apache is enabled and running
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true

- name: Reload Apache
  ansible.builtin.service:
    name: apache2
    state: reloaded
